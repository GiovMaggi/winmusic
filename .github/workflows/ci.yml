name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only these self test sections (comma separated, e.g. E,P). Empty = all.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build + DSP tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit tests (resampler, drift correction, gain)
        run: dotnet test tests/WinMusic.Core.Tests -c Release --logger "console;verbosity=detailed"
      - name: Publish WinMusic.exe (single file, no .NET install needed)
        run: dotnet publish src/WinMusic -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/app
      - name: Publish self test
        run: dotnet publish src/WinMusic.SelfTest -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -o out/selftest
      - uses: actions/upload-artifact@v4
        with:
          name: WinMusic
          path: out/app/WinMusic.exe
      - uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: out/selftest/WinMusic.SelfTest.exe

  device-test:
    name: Real audio test (VB-CABLE on Windows)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: selftest
          path: selftest
      - uses: actions/download-artifact@v4
        with:
          name: WinMusic
          path: app
      - name: Enable Windows audio service
        shell: pwsh
        run: |
          Set-Service -Name AudioEndpointBuilder -StartupType Automatic
          Set-Service -Name Audiosrv -StartupType Automatic
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
          Get-Service AudioEndpointBuilder, Audiosrv
      - name: GUI test before VB-CABLE is installed (first launch)
        shell: pwsh
        run: |
          $gui = Start-Process app\WinMusic.exe -ArgumentList '--smoketest-nocable',"$PWD\gui-nocable-report.md" -PassThru
          if (-not $gui.WaitForExit(60000)) { Stop-Process $gui -Force; Write-Host 'timed out'; exit 1 }
          Get-Content gui-nocable-report.md
          Get-Content gui-nocable-report.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $gui.ExitCode
      - name: Install VB-CABLE
        shell: pwsh
        run: ./scripts/ci-install-vbcable.ps1
      - name: Allow desktop apps to use microphones (Windows privacy setting)
        shell: pwsh
        run: |
          foreach ($root in 'HKLM:', 'HKCU:') {
            $k = "$root\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
            New-Item -Path $k -Force | Out-Null
            Set-ItemProperty -Path $k -Name Value -Value Allow
            New-Item -Path "$k\NonPackaged" -Force | Out-Null
            Set-ItemProperty -Path "$k\NonPackaged" -Name Value -Value Allow
          }
          $k = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
          if (Test-Path $k) { Remove-ItemProperty -Path $k -Name LetAppsAccessMicrophone -ErrorAction SilentlyContinue }
      - name: Run self test
        shell: pwsh
        run: |
          ./selftest/WinMusic.SelfTest.exe --report selftest-report.md --only "${{ github.event.inputs.only }}"
          $code = $LASTEXITCODE
          if (Test-Path selftest-report.md) { Get-Content selftest-report.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
          exit $code
      - name: GUI end-to-end test (the real WinMusic.exe)
        if: (success() || failure()) && github.event.inputs.only == ''

        shell: pwsh
        run: |
          $toneDir = "$env:TEMP\WinMusicToneApp"
          New-Item -ItemType Directory -Force $toneDir | Out-Null
          Copy-Item selftest\WinMusic.SelfTest.exe "$toneDir\ToneApp.exe"
          $tone = Start-Process "$toneDir\ToneApp.exe" -ArgumentList '--tone-cable','1000','90','1' -PassThru
          Start-Sleep 2
          $gui = Start-Process app\WinMusic.exe -ArgumentList '--smoketest','ToneApp.exe',"$PWD\gui-report.md" -PassThru
          if (-not $gui.WaitForExit(120000)) { Stop-Process $gui -Force; Write-Host 'GUI test timed out'; $code = 1 } else { $code = $gui.ExitCode }
          if (Test-Path gui-report.md) { Get-Content gui-report.md }
          $gui2 = Start-Process app\WinMusic.exe -ArgumentList '--smoketest-startup','ToneApp.exe',"$PWD\gui-startup-report.md" -PassThru
          if (-not $gui2.WaitForExit(120000)) { Stop-Process $gui2 -Force; Write-Host 'startup GUI test timed out'; $code = 1 } elseif ($gui2.ExitCode -ne 0) { $code = 1 }
          if (Test-Path gui-startup-report.md) { Get-Content gui-startup-report.md; Get-Content gui-startup-report.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY } else { Write-Host 'no startup report'; $code = 1 }
          Stop-Process $tone -Force -ErrorAction SilentlyContinue
          if (Test-Path gui-report.md) { Get-Content gui-report.md; Get-Content gui-report.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY } else { Write-Host 'no GUI report'; $code = 1 }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-report
          path: |
            selftest-report.md
            gui-report.md
            gui-nocable-report.md
            gui-startup-report.md

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, device-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WinMusic
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: selftest-report
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinMusic.exe
            dist/selftest-report.md
            dist/gui-report.md
            third_party/vbcable/VBCABLE_Driver_Pack46.zip
          generate_release_notes: true
