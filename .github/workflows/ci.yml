name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build + DSP tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit tests (resampler, drift correction, limiter)
        run: dotnet test tests/WinMusic.Core.Tests -c Release --logger "console;verbosity=detailed"
      - name: Publish WinMusic.exe (single file, no .NET install needed)
        run: dotnet publish src/WinMusic -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/app
      - name: Publish self test
        run: dotnet publish src/WinMusic.SelfTest -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -o out/selftest
      - uses: actions/upload-artifact@v4
        with:
          name: WinMusic
          path: out/app/WinMusic.exe
      - uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: out/selftest/WinMusic.SelfTest.exe

  device-test:
    name: Real audio test (VB-CABLE on Windows)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: selftest
          path: selftest
      - name: Enable Windows audio service
        shell: pwsh
        run: |
          Set-Service -Name AudioEndpointBuilder -StartupType Automatic
          Set-Service -Name Audiosrv -StartupType Automatic
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
          Get-Service AudioEndpointBuilder, Audiosrv
      - name: Install VB-CABLE
        shell: pwsh
        run: ./scripts/ci-install-vbcable.ps1
      - name: Run self test
        shell: pwsh
        run: |
          ./selftest/WinMusic.SelfTest.exe --report selftest-report.md
          $code = $LASTEXITCODE
          Get-Content selftest-report.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-report
          path: selftest-report.md

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, device-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WinMusic
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: selftest-report
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinMusic.exe
            dist/selftest-report.md
          generate_release_notes: true
